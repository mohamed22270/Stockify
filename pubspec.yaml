name: stockflow_flutter
description: "Stockify - An offline-first Flutter inventory app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/stockify_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/stockify_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/stockify_icon.png"
    background_color: "#061B33"
    theme_color: "#00D6C5"
  windows:
    generate: true
    image_path: "assets/icon/stockify_icon.png"
    icon_size: 256
